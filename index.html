<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Izaaaaaaa ❤️</title>

    <link rel="stylesheet" href="style.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>

<!-- Floating Hearts -->
<div class="hearts"></div>

<!-- Floating Balloons -->
<div class="balloons">
    <div class="balloon red"></div>
    <div class="balloon blue"></div>
    <div class="balloon yellow"></div>
    <div class="balloon green"></div>
    <div class="balloon pink"></div>
</div>

<div class="container">

    <h1>🎂 Happy Birthday Izaaaaaaa 🎂</h1>

    <h3>18 June 💖</h3>

    <!-- Photo Slider -->
    <div class="slider">
        <img id="slide" src="photo1.jpg" alt="Birthday Photo">
    </div>

    <h2>For My Best Friend ❤️</h2>

    <p id="message"></p>

    <button onclick="surprise()">
        🎁 Open Surprise
    </button>

    <div id="surpriseText"></div>

</div>

<!-- Music -->
<audio id="music" loop>
    <source src="happybirthday.mp3" type="audio/mpeg">
</audio>

<!-- Confetti Canvas -->
<canvas id="confetti"></canvas>

<!-- Footer -->
<footer>
    Made with ❤️ by Hassan
</footer>

<script src="script.js"></script>

</body>
</html>
